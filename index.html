<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1109">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Der Sniper Pro</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="backBtn" style="display:none" onclick="history.back()">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div style="flex:1">
    <span class="sub" data-i18n="app_sub">Der Sniper</span>
    <h1 id="pageTitle" data-i18n="title_home">Übersicht</h1>
  </div>
  <button class="icon-btn" id="actionBtn" style="display:none"></button>
</header>

<main id="app"></main>

<nav class="nav">
  <a href="#/home" data-route="home"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2h-4v-7H9v7H5a2 2 0 01-2-2z"/></svg><span data-i18n="nav_home">Start</span></a>
  <a href="#/weapons" data-route="weapons"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg><span data-i18n="nav_weapons">Waffen</span></a>
  <a href="#/ballistics" data-route="ballistics"><svg viewBox="0 0 24 24"><path d="M3 20l6-6M13 4l7 7-3 3-7-7z"/><circle cx="8" cy="17" r="1.5"/></svg><span data-i18n="nav_ball">Ballistik</span></a>
  <a href="#/tools" data-route="tools"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg><span data-i18n="nav_tools">Tools</span></a>
  <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span data-i18n="nav_setup">Setup</span></a>
</nav>

<!-- Info Modal -->
<div id="infoModal" class="modal-backdrop" style="display:none" onclick="if(event.target===this)closeInfo()">
  <div class="modal">
    <h2 id="infoTitle">Titel</h2>
    <div id="infoText" style="margin-bottom:20px;line-height:1.6;">Text</div>
    <a id="infoLink" href="#" target="_blank" class="btn block" style="text-decoration:none;">Mehr auf Wikipedia ↗</a>
    <button class="btn primary block" onclick="closeInfo()">Schließen</button>
  </div>
</div>

<!-- Sensor Modal -->
<div id="sensorModal" class="modal-backdrop" style="display:none" onclick="if(event.target===this)closeSensors()">
  <div class="modal">
    <h2>Sensor Messung</h2>
    <div id="sensorStatus" style="text-align:center;font-size:1.2rem;margin-bottom:16px;">Bitte ruhig halten...</div>
    <div style="display:flex;justify-content:space-around;margin-bottom:20px;font-family:var(--mono);text-align:center;">
      <div><div class="dim small">Richtung</div><div id="sensorHeading" style="font-size:1.5rem;">--°</div></div>
      <div><div class="dim small">Winkel</div><div id="sensorPitch" style="font-size:1.5rem;">--°</div></div>
    </div>
    <div id="sensorAmpel" style="height:10px;background:var(--surface-2);border-radius:5px;margin-bottom:20px;"></div>
    <button class="btn primary block" id="btnApplySensor" disabled onclick="applySensorData()">Werte übernehmen</button>
  </div>
</div>

<script src="ballistics.js"></script>
<script src="app.js"></script>
</body>
</html>
